# 결함을 심은 사례 — Predict_Success
# 임시 clone의 base 커밋 위에 edits를 적용해 커밋 하나를 만들고 분석한다. 원래 저장소는 바뀌지 않는다.
# expected: 기대 판정, expect_rules: 반드시 발동해야 하는 규칙, expect_scope: 기대 검증 범위 (판정 규칙 v3)
repo: ../../predict-success
base: 895dbe4
seeds:
  - id: S01
    description: 테스트가 지나가지 않는 새 분기 추가 (engine.combine)
    expected: REVIEW REQUIRED
    expect_rules: [G01]
    edits:
      - path: src/metrics/engine.py
        find: |2
              if worst != "normal":
                  result.score_eligible = "보류"
        replace: |2
              if worst != "normal":
                  result.score_eligible = "보류"
              if len(inputs) > 50:
                  result.notes.append("입력이 많음")
  - id: S02
    description: 테스트된 줄을 같은 동작으로 리팩터 (engine.combine)
    expected: SAFE
    expect_rules: []
    edits:
      - path: src/metrics/engine.py
        find: key=STATUS_RANK.get, default="normal")
        replace: 'key=lambda s: STATUS_RANK[s], default="normal")'
  - id: S03
    description: 기간 연도 비교를 깨뜨림 (engine.Input.period_problem)
    expected: BLOCK
    expect_rules: [B03]
    edits:
      - path: src/metrics/engine.py
        find: "if int(self.period_end[:4]) != self.year:"
        replace: "if int(self.period_end[:4]) != self.year + 1:"
  - id: S04
    description: 없는 이름을 import (수집 오류)
    expected: BLOCK
    expect_rules: [B04]
    edits:
      - path: src/metrics/engine.py
        find: from statistics import median, pstdev
        replace: from statistics import median, pstdev, no_such_function
  - id: S05
    description: 소스에 API 키를 넣음
    expected: BLOCK
    expect_rules: [B01]
    edits:
      - path: src/metrics/engine.py
        find: PERIOD_OK = {"from_filing_text", "from_manual"}
        replace: |-
          PERIOD_OK = {"from_filing_text", "from_manual"}
          API_KEY = "sk-abcdefghijklmnopqrstuvwxyz012345"
  - id: S06
    description: README만 수정
    expected: SAFE
    expect_rules: []
    expect_scope: COMPLETE
    edits:
      - path: README.md
        find: "# EvidenceFirst — 근거 기반 사업성과 분석"
        replace: "# EvidenceFirst — 근거 기반 사업성과 분석 (seed)"
  - id: S07
    description: 점수 테스트 파일을 지우고 보간 계산을 같은 동작으로 바꿈
    expected: REVIEW REQUIRED
    expect_rules: [G01]
    edits:
      - path: tests/test_scoring.py
        delete: true
      - path: src/scoring/score.py
        find: return y0 + (y1 - y0) * (x - x0) / (x1 - x0)
        replace: return y0 + (x - x0) * (y1 - y0) / (x1 - x0)
  - id: S08
    description: 의존성 추가
    expected: REVIEW REQUIRED
    expect_rules: [R04]
    edits:
      - path: requirements.txt
        find: pytest==9.1.1
        replace: |-
          pytest==9.1.1
          rich==14.0.0
  - id: S09
    description: 어디서도 불리지 않는 새 모듈 추가
    expected: REVIEW REQUIRED
    expect_rules: [G01]
    edits:
      - path: src/metrics/extra.py
        create: |
          def ratio(a, b):
              if b == 0:
                  return None
              return a / b
  - id: S10
    description: 설정 파일 주석만 수정 — v3부터 검증 범위 밖이라 SAFE가 아님 (주석인지 판단하지 않는다)
    expected: REVIEW REQUIRED
    expect_rules: [E02]
    expect_scope: UNSUPPORTED
    edits:
      - path: configs/scoring_v2.yaml
        find: "# 점수 규칙 v2"
        replace: "# 점수 규칙 v2 (seed)"
  # --- 정상 변경 (1.3, 2026-11-04): 불필요한 경고를 잰다. 기대는 SAFE + COMPLETE ---
  - id: N01
    description: 테스트된 함수를 같은 동작으로 리팩터 (interpolate의 xs·ys를 zip으로)
    expected: SAFE
    expect_rules: []
    expect_scope: COMPLETE
    edits:
      - path: src/scoring/score.py
        find: |2
              xs = [p[0] for p in points]
              ys = [p[1] for p in points]
        replace: |2
              xs, ys = (list(c) for c in zip(*points))
  - id: N02
    description: 테스트만 추가 (기존 함수의 경계값)
    expected: SAFE
    expect_rules: []
    expect_scope: COMPLETE
    edits:
      - path: tests/test_seed_boundary.py
        create: |
          from src.scoring.score import interpolate


          def test_interpolate_clamps_both_ends():
              points = [[0, 0], [10, 100]]
              assert interpolate(-5, points) == 0
              assert interpolate(15, points) == 100
              assert interpolate(5, points) == 50
  - id: N03
    description: 테스트된 함수의 지역 변수 이름 변경
    expected: SAFE
    expect_rules: []
    expect_scope: COMPLETE
    edits:
      - path: src/scoring/score.py
        find: |2
              i = bisect_right(xs, x) - 1
              x0, x1, y0, y1 = xs[i], xs[i + 1], ys[i], ys[i + 1]
        replace: |2
              seg = bisect_right(xs, x) - 1
              x0, x1, y0, y1 = xs[seg], xs[seg + 1], ys[seg], ys[seg + 1]
  - id: N04
    description: 소스의 주석·docstring만 수정
    expected: SAFE
    expect_rules: []
    expect_scope: COMPLETE
    edits:
      - path: src/scoring/score.py
        find: '    """고정 구간 선형 보간. 경계점 사이는 직선, 양 끝 밖은 끝점 점수로 고정 (README 7.1 B)."""'
        replace: '    """고정 구간 선형 보간. 경계점 사이는 직선, 양 끝 밖은 끝점 점수로 고정한다 (README 7.1 B, seed)."""'
  - id: N05
    description: 새 함수와 그 테스트를 함께 추가
    expected: SAFE
    expect_rules: []
    expect_scope: COMPLETE
    edits:
      - path: src/scoring/score.py
        find: "def raw_score(metric: dict, rule: dict) -> float | None:"
        replace: |-
          def clamp_score(s: float) -> float:
              if s < 0:
                  return 0.0
              if s > 100:
                  return 100.0
              return s


          def raw_score(metric: dict, rule: dict) -> float | None:
      - path: tests/test_seed_clamp.py
        create: |
          from src.scoring.score import clamp_score


          def test_clamp_score():
              assert clamp_score(-1) == 0.0
              assert clamp_score(101) == 100.0
              assert clamp_score(50) == 50
  # --- 범위 밖 변경 (1.3): 검증하지 못한 것을 정직하게 표시하는지 본다 ---
  - id: U01
    description: JavaScript 파일 추가 (Python이 아닌 소스)
    expected: REVIEW REQUIRED
    expect_rules: [E02]
    expect_scope: UNSUPPORTED
    edits:
      - path: web/app.js
        create: |
          export function ratio(a, b) {
            return b === 0 ? null : a / b;
          }
  - id: U02
    description: 새 데이터 파일 추가
    expected: REVIEW REQUIRED
    expect_rules: [E02]
    expect_scope: UNSUPPORTED
    edits:
      - path: data/manual/seed_notes.csv
        create: |
          corp_code,note
          00000000,seed
  - id: U03
    description: CI 워크플로 추가
    expected: REVIEW REQUIRED
    expect_rules: [E02]
    expect_scope: UNSUPPORTED
    edits:
      - path: .github/workflows/ci.yml
        create: |
          name: ci
          on: [push]
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: pytest
  - id: U04
    description: 분류 규칙에 없는 파일(Makefile) + 소스 주석 수정 — 일부만 검증
    expected: REVIEW REQUIRED
    expect_rules: [E02]
    expect_scope: PARTIAL
    edits:
      - path: Makefile
        create: "test:\n\tpytest\n"
      - path: src/scoring/score.py
        find: '    """고정 구간 선형 보간. 경계점 사이는 직선, 양 끝 밖은 끝점 점수로 고정 (README 7.1 B)."""'
        replace: '    """고정 구간 선형 보간 (README 7.1 B)."""'
  # Stage 1.7 (판정 규칙 v3.2): 바뀐 테스트가 실행되지 않음 (T03). expect_t03은 원인 코드가 정확히 이것이어야 함 (빈 목록 = T03 없음)
  - id: T01
    description: __init__이 있는 Test 클래스에 테스트 추가 (pytest가 결과를 내지 않음)
    expected: REVIEW REQUIRED
    expect_rules: [T03]
    expect_t03: [NO_TEST_RESULTS]
    expect_scope: COMPLETE
    edits:
      - path: tests/test_seed_cls.py
        create: |
          from src.scoring.score import interpolate


          class TestInterpolateSeed:
              def __init__(self):
                  self.points = [(0, 0), (10, 100)]

              def test_middle(self):
                  assert interpolate(5, self.points) == 50
  - id: T02
    description: 추가한 테스트 2개가 모두 skip
    expected: REVIEW REQUIRED
    expect_rules: [T03]
    expect_t03: [CHANGED_TESTS_ALL_SKIPPED]
    expect_scope: COMPLETE
    edits:
      - path: tests/test_seed_skip.py
        create: |
          import pytest

          pytestmark = pytest.mark.skipif(True, reason="seed: 데이터 없음")


          def test_a():
              assert True


          def test_b():
              assert True
  - id: T03
    description: 모듈 수준 importorskip 파일에 테스트 추가 (함수별 결과 없음)
    expected: REVIEW REQUIRED
    expect_rules: [T03]
    expect_t03: [MODULE_SKIPPED]
    expect_scope: COMPLETE
    edits:
      - path: tests/test_seed_mod.py
        create: |
          import pytest

          mod = pytest.importorskip("no_such_module_seed")


          def test_a():
              assert mod
  - id: T04
    description: 테스트 파일 9개 전부 삭제 (no_tests)
    expected: REVIEW REQUIRED
    expect_rules: [T03]
    expect_t03: [TEST_SUITE_REMOVED]
    expect_scope: COMPLETE
    edits:
      - {path: tests/test_account_map.py, delete: true}
      - {path: tests/test_bs_sections.py, delete: true}
      - {path: tests/test_dart_collector.py, delete: true}
      - {path: tests/test_dart_facts.py, delete: true}
      - {path: tests/test_manual.py, delete: true}
      - {path: tests/test_market.py, delete: true}
      - {path: tests/test_metrics.py, delete: true}
      - {path: tests/test_scoring.py, delete: true}
      - {path: tests/test_trend.py, delete: true}
  # 반례: T03이 나오면 안 됨
  - id: K01
    description: 실행되는 테스트 파일에 헬퍼 함수만 추가
    expected: SAFE
    expect_rules: []
    expect_t03: []
    edits:
      - path: tests/test_scoring.py
        find: |
          # ---------------------------------------------------------------- 규칙 파일
        replace: |
          def _seed_helper():
              return 1


          # ---------------------------------------------------------------- 규칙 파일
  - id: K02
    description: parametrize 값 하나만 skip인 새 테스트
    expected: SAFE
    expect_rules: []
    expect_t03: []
    edits:
      - path: tests/test_seed_param.py
        create: |
          import pytest

          from src.scoring.score import interpolate


          @pytest.mark.parametrize("x", [0, 99])
          def test_edges(x):
              if x == 99:
                  pytest.skip("seed: 한 값만 skip")
              assert interpolate(x, [(0, 0), (10, 100)]) == 0
  - id: K03
    description: 테스트 함수가 없는 test_*.py 헬퍼 파일 추가
    expected: SAFE
    expect_rules: []
    expect_t03: []
    edits:
      - path: tests/test_seed_helpers.py
        create: |
          def make_points():
              return [(0, 0), (10, 100)]
