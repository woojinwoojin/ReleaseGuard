# Eval Set — 대상 저장소와 수기 라벨 (회귀용 15개)
# 자동 정답(같은 커밋에서 바뀐 테스트)은 실행할 때 계산하므로 여기 적지 않는다.
#
# 라벨 v2 (2026-11-04) — 두 가지를 따로 단다. 판정 규칙과 독립적으로 정한다.
# - need: 머지 전에 사람이 봐야 했는가 (yes / no). 결과 기준.
#   need_reason: followup_fix(이후 커밋에서 이 변경의 문제가 고쳐짐, followup_fix에 기록)
#              | policy(정책·기준 변경이라 사람 확인 필요) | untested(동작이 바뀌는데 검증 안 된 부분이 보임)
#              | risky_area(테스트가 있어도 사람이 봐야 하는 영역: DB 마이그레이션, 동시성 등) | none
# - expected_scope: 변경 파일만 보고 정한 검증 범위 (판정 규칙 v3의 정의)
#   COMPLETE: 문서를 뺀 변경이 모두 Python 소스·테스트 / PARTIAL: 일부가 설정·데이터·비Python 등
#   UNSUPPORTED: 문서를 뺀 변경이 모두 그런 파일
# 라벨 v1(expected: SAFE/REVIEW/BLOCK)은 need로 옮겼다: SAFE → no, REVIEW → yes. 판정 정확도는 더 쓰지 않는다
# (v3는 범위 밖 변경을 의도적으로 REVIEW로 올리므로, need=no인 경고는 원인별로 따로 센다).
#
# labeled_by: user = 사용자 확인 (need: 2026-11-03 15개 일괄 확인), expected_scope는 claude-draft (2026-11-04, 확인 전)
