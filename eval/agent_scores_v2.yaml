# Agent Eval 실험 2 채점 — Claude 초안을 사용자가 2026-11-10 확정 (F1 동작 점수 1건 교체 후)
# 기준: docs/eval/agent_eval_protocol.md (0·1·2). 채점자는 실험 1 결과와 후속 수정 내용을 이미 안다 (눈가림 아님).
# 사용자 검토는 요약표를 기준으로 했다. 16개 원본 응답의 사실 대조는 Claude가 했고(F1·N3·B2만 다시 확인),
# 사용자가 원본을 독립적으로 대조한 것은 아니다.
# 2026-11-10에 명시한 적용 규칙 (실험 1과 같은 기준을 문장으로 고정):
# - behavior는 동작 설명의 내용만 본다. 언어 혼입 같은 출력 품질은 점수에 넣지 않고 note에 적는다.
#   정렬의 마지막을 "가장 최신"이라고 단정하면 1점 (실험 1 F1 실행 2와 같은 기준).
# - grounding: 인용이 모두 유효하고 핵심을 뒷받침하면 2. 핵심은 유효한 인용이 뒷받침하지만 없는·읽지 않은
#   인용이 섞이면 1. 핵심을 뒷받침하는 인용이 없으면 0. 참조 오류 수는 점수와 별도로 집계한다 (references_valid).
# - added_value·consistency는 사례당 하나이고, 추가 가치는 두 실행 중 약한 쪽에 맞춘다 (모든 사례 동일).
scored_by: user (Claude draft, confirmed 2026-11-10)
review_basis: summary table; raw-response check by Claude, not independently by the user
cases:
  F3:
    run1: {grounding: 2, behavior: 2, trigger: 2, feasibility: 2, assertion: 2}
    run2: {grounding: 2, behavior: 2, trigger: 2, feasibility: 2, assertion: 2}
    consistency: 2
    added_value: 1
    note: 실험 1과 같음
  N1:
    run1: {grounding: 2, behavior: 2, trigger: 1, feasibility: 2, assertion: 2}
    run2: {grounding: 2, behavior: 2, trigger: 2, feasibility: 2, assertion: 2}
    consistency: 1
    added_value: 1
    note: 실행 1은 유효한 카테고리 경로라 300줄(return error)에 닿지 않음. 실행 2는 없는 카테고리 경로
  F1:
    run1: {grounding: 2, behavior: 2, trigger: 2, feasibility: 1, assertion: 2}
    run2: {grounding: 2, behavior: 1, trigger: 1, feasibility: 1, assertion: 1}
    consistency: 1
    added_value: 1
    note: >-
      2026-11-10 교체 — 초안은 실행 1 behavior 1(언어 혼입 감점)·실행 2 behavior 2였다.
      실행 1의 섞인 단어는 아르메니아어 'վերջին'(마지막)으로, 정렬 마지막을 반환한다는 맞는 내용이라 behavior 2,
      언어 혼입은 출력 품질 문제로 따로 적는다. 실행 2는 정렬 마지막을 '가장 최신 폴더'라고 단정해 실험 1 F1 실행 2와
      같은 기준으로 behavior 1. 합계는 15로 같다. 실행 2는 예외 경로만 보고 ROOT 교체를 말하지 않음 (조건 1).
      stats 폴더가 없으면 iterdir가 메시지 없는 FileNotFoundError를 내서 메시지 assertion이 실패
  F2:
    run1: {grounding: 2, behavior: 2, trigger: 2, feasibility: 2, assertion: 2}
    run2: {grounding: 2, behavior: 2, trigger: 2, feasibility: 1, assertion: 1}
    consistency: 1
    added_value: 1
    note: 실행 1은 guideline_section 직접 호출로 좋아짐 (추가 검증 17/17). 입력에 이 함수의 기존 테스트가 없어 입력 보강의 효과라고 볼 근거는 없음. 실행 2는 여전히 report() 경유
  N2:
    run1: {grounding: 2, behavior: 2, trigger: 2, feasibility: 2, assertion: 2}
    run2: {grounding: 2, behavior: 2, trigger: 2, feasibility: 2, assertion: 2}
    consistency: 2
    added_value: 1
    note: 실험 1과 같은 수준
  N3:
    run1: {grounding: 1, behavior: 2, trigger: 1, feasibility: 1, assertion: 2}
    run2: {grounding: 1, behavior: 2, trigger: 2, feasibility: 1, assertion: 2}
    consistency: 2
    added_value: 0
    note: >-
      둘 다 기존 테스트와 같은 이름을 제안 (그대로 넣으면 기존 함수를 덮어씀), 여전히 skip 파일, skip 언급 없음.
      grounding 1 근거 (2026-11-10 코드 대조): 동작 설명은 유효한 app.py:167-177 인용과 2e652ab의 코드가 맞게 뒷받침한다
      (그래서 0이 아님). 다만 실행 1은 읽지 않은 tests/test_app.py를 1-200으로 인용했고(142줄, 같은 이름의 테스트가
      132줄에 있어 인용한 내용이 제안과 오히려 충돌), 실행 2는 호출한 적 없는 tool:#1을 인용했다 (도구 0회)
  B1:
    run1: {grounding: 2, behavior: 2, trigger: 2, feasibility: 1, assertion: 2}
    run2: {grounding: 2, behavior: 2, trigger: 2, feasibility: 1, assertion: 2}
    consistency: 1
    added_value: 1
    note: 실행 1은 202~203줄을 겨냥, 실행 2는 시간 표시로 빠져 실험 1보다 약함. 둘 다 skip 파일, skip 언급 없음
  B2:
    run1: {grounding: 2, behavior: 2, trigger: 2, feasibility: 1, assertion: 2}
    run2: {grounding: 2, behavior: 2, trigger: 2, feasibility: 1, assertion: 2}
    consistency: 2
    added_value: 2
    note: 패치 지점은 그대로 맞음. 도구를 안 써서 저장소의 fixture·read_sse를 쓰지 않아 실험 1보다 바로 쓰기 어려움
