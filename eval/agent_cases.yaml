# Agent Eval 사례 (Stage 1.6) — 공백 하나가 사례 하나다.
# status: draft면 eval-agent가 API를 부르지 않는다. 사용자 확인 후 fixed로 바꾼다.
# type·fix·note는 평가용이다. 에이전트 입력(build_input)에 들어가지 않는다.
# 평가 기준: docs/eval/agent_eval_protocol.md
# 공백은 줄 단위 범위(fl.gaps)와 정확히 같아야 한다 (--check로 확인). 파일 전체가 공백이면 한 범위가 되어 고를 수 없다.
# 그래서 week1 사례는 넣지 않았고(f483ebe app.py가 전체 한 범위), fixture 사례도 없다(fixture에서만 실행된 줄이 있는 2752751에는 G01이 없음).
status: draft
model: gpt-5.4-mini-2026-03-17
# 2026-11-07 https://developers.openai.com/api/docs/pricing 확인. 캐시 할인은 계산에 넣지 않는다 (실제보다 높게 나옴).
pricing:
  input_usd_per_m: 0.75
  output_usd_per_m: 4.50
limits:
  max_steps: 4
  max_tool_calls: 6
  reasoning_effort: low
  max_output_tokens: 4000
# stop_usd는 프로그램이 추정해서 막는 값이다. 청구 상한이 아니다.
budget:
  max_requests: 64
  target_usd: 2
  stop_usd: 5
request_timeout_seconds: 120
repeat: 2
repos:
  predict: ../../predict-success
  week1: ../../2026-10/week1-csv-llm-report
  week2: ../../2026-10/week2-tool-calling
  week3: ../../2026-10/week3-fastapi-ui
